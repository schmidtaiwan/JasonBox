<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>收好收滿</title>
  <link rel="icon" href="icon.svg?v=4" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest?v=4">
  <link rel="stylesheet" href="app.css?v=4">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://schmidtaiwan.github.io/JasonHome/google_config.js" defer></script>
  <script src="drive.js?v=4" defer></script>
  <script src="plan.js?v=4" defer></script>
  <script src="app.js?v=4" defer></script>
</head>
<body>
  <header class="brand"><img src="icon.svg?v=4" alt=""><div><strong>收好收滿</strong><p id="page-version" class="page-version"></p></div><button id="logout" class="quiet" hidden>登出</button></header>
  <section id="gate" class="gate" aria-labelledby="gate-title">
    <div class="hero">
      <div><h1 id="gate-title">收好收滿</h1><p>登入 Google，查看與管理你的收納清單。</p></div>
      <div class="illustration" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <button id="login" class="primary">使用 Google 帳號登入</button>
    <p id="login-status" role="status"></p>
  </section>
  <main hidden>
    <section class="hero">
      <div><h1 id="page-title">我的收納</h1><p id="summary"></p></div>
      <div class="illustration" aria-hidden="true"><i></i><i></i><i></i></div>
    </section>
    <section id="floor-plans" class="floor-plans" aria-labelledby="floor-heading">
      <div class="section-title"><h2 id="floor-heading">我的四層透天</h2><span>固定樓層</span></div>
      <p class="muted">直接點圖上的位置新增存放空間，命名為「櫃子」或「床底下」；點圖示即可放入物品。鍵盤可用 Enter 在所選樓層中央新增。</p>
      <div id="floor-tabs" class="floor-tabs" aria-label="選擇樓層"></div>
      <div id="floor-image" class="floor-image" role="img" aria-label="四層樓平面圖"><img src="assets/floor-plans.png?v=4" alt="四層透天配置示意圖，一樓含大車庫；未依實際尺寸繪製"></div>
      <a class="plan-original" href="assets/floor-plans.png?v=4" target="_blank" rel="noopener">查看完整平面圖</a>
    </section>
    <label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="搜尋存放空間或物品" aria-label="搜尋存放空間或物品"></label>
    <nav id="path" aria-label="收納位置"></nav>
    <p id="mutation-status" role="status"></p>
    <button id="edit-space" class="quiet" hidden>編輯這個存放空間</button>
    <section aria-labelledby="list-title">
      <div class="section-title"><h2 id="list-title"></h2><span id="count"></span></div>
      <div id="list"></div>
    </section>
  </main>
  <footer hidden><button id="add" class="primary" disabled></button></footer>
  <dialog id="editor">
    <form id="form">
      <div class="section-title"><h2 id="editor-title"></h2><button type="button" id="close" class="quiet" aria-label="關閉">✕</button></div>
      <p id="location" class="muted"></p>
      <p id="entry-time" class="muted"></p>
      <label class="field">名稱<input id="name" required maxlength="80"></label>
      <div id="photos" hidden>
        <img id="preview" alt="物品照片預覽" hidden>
        <div class="photo-controls">
          <label class="photo-button">拍照<input id="camera" type="file" accept="image/*" capture="environment"></label>
          <label class="photo-button">選擇照片<input id="gallery" type="file" accept="image/*"></label>
          <button type="button" class="quiet" id="remove-photo" hidden>移除照片</button>
        </div>
      </div>
      <p id="form-status" role="status"></p>
      <div class="editor-actions"><button type="button" id="remove" class="danger" hidden>刪除</button><button class="primary" id="save">儲存</button></div>
    </form>
  </dialog>
  <dialog id="update-dialog" aria-labelledby="update-title" aria-describedby="update-version">
    <h2 id="update-title">有新版可以更新</h2>
    <p id="update-version" class="muted"></p>
    <div class="editor-actions"><button id="update-reload" class="primary" autofocus>立即更新</button></div>
  </dialog>
</body>
</html>
