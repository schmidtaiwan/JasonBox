<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>收納管家</title>
  <link rel="icon" href="icon.svg?v=69" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest?v=69">
  <link rel="stylesheet" href="app.css?v=69">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="https://schmidtaiwan.github.io/JasonHome/google_config.js" defer></script>
  <script src="drive.js?v=69" defer></script>
  <script src="appearance.js?v=69" defer></script>
  <script src="floor-cache.js?v=69" defer></script>
  <script src="photo.js?v=69" defer></script>
  <script src="plan.js?v=69" defer></script>
  <script src="export.js?v=69" defer></script>
  <script src="gemini.js?v=69" defer></script>
  <script src="app.js?v=69" defer></script>
</head>
<body>
  <header class="brand">
    <img src="icon.svg?v=69" alt=""><div class="brand-name"><strong>收納管家</strong><p id="page-version" class="page-version"></p>
      <p id="drive-quota" class="page-version" role="status"></p>
      <button id="retry-quota" class="quiet" hidden>重試讀取容量</button></div>
    <section id="header-storage" class="header-storage" hidden aria-label="收納與雲端容量">
      <h1 id="page-title">我的收納</h1><p id="summary"></p>
    </section>
    <details id="export-menu" hidden>
      <summary aria-label="匯出與平面圖" title="匯出與平面圖">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/>
      </svg>
      </summary>
      <div class="account-panel export-panel">
        <button id="export-pdf" type="button" class="quiet">匯出 PDF</button>
        <a href="assets/floor-plans-v63.svg?v=69" target="_blank" rel="noopener">查看完整平面圖</a>
      </div>
    </details>
    <button id="marker-settings" type="button" aria-label="圖示設定" title="圖示設定" hidden>
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9.5 3h5l.6 2.6 1.7 1 2.6-.8 2.5 4.4-2 1.8v2l2 1.8-2.5 4.4-2.6-.8-1.7 1-.6 2.6h-5l-.6-2.6-1.7-1-2.6.8-2.5-4.4 2-1.8v-2l-2-1.8 2.5-4.4 2.6.8 1.7-1z" transform="translate(0 -1)"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
    </button>
    <details id="account-menu" class="account-menu" hidden>
      <summary id="account-toggle" aria-label="登入帳號">
        <img id="account-avatar" alt="" referrerpolicy="no-referrer" hidden><span id="avatar-fallback">G</span>
      </summary>
      <div class="account-panel"><p id="account-email"></p><button id="logout" class="quiet" hidden>登出</button></div>
    </details>
  </header>
  <section id="gate" class="gate" aria-labelledby="gate-title">
    <div class="hero">
      <div><h1 id="gate-title">三生有杏<br>收納管家</h1></div>
      <div class="illustration" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
    <button id="login" class="primary">使用 Google 帳號登入</button>
    <p id="login-status" role="status"></p>
    <img class="login-photo" src="assets/family.png?v=69" alt="家人在海邊的合照">
  </section>
  <main hidden>
    <section id="floor-plans" class="floor-plans" aria-labelledby="floor-heading">
      <h2 id="floor-heading" hidden>四層透天平面圖</h2>
      <div id="floor-tabs" class="floor-tabs" aria-label="選擇樓層"></div>
      <div id="marker-tools" class="marker-tools" role="region" aria-label="調整收納圖示" aria-live="polite" hidden></div>
      <div id="alignment-tools" class="marker-tools" role="region" aria-label="對齊收納圖示" hidden></div>
      <div id="floor-image" class="floor-image" role="img" aria-label="四層樓平面圖"><img src="assets/floor-plans-v63.svg?v=69" alt="四層透天配置示意圖，一樓含大車庫；未依實際尺寸繪製"></div>
    </section>
    <div class="path-toolbar">
      <nav id="path" aria-label="收納位置"></nav>
      <div class="view-switch" role="group" aria-label="顯示方式">
        <button type="button" id="view-list" aria-pressed="false">細項</button>
        <button type="button" id="view-details" aria-pressed="true">列表</button>
        <button type="button" id="view-preview" aria-pressed="false">預覽</button>
      </div>
      <span id="current-space-icon" class="current-space-icon" aria-hidden="true" hidden></span>
    </div>
    <p id="mutation-status" role="status"></p>
    <section id="space-layout" class="space-layout" hidden aria-label="存放空間照片與內部位置"></section>
    <button id="edit-space" class="quiet" hidden>編輯這個存放空間</button>
    <section aria-labelledby="list-title">
      <div class="section-title"><h2 id="list-title"></h2><div class="list-actions"><span id="count"></span><button id="move-items" type="button" class="secondary" hidden>移動物品</button><button id="delete-items" type="button" class="danger" hidden>多選刪除</button></div></div>
      <div id="list"></div>
    </section>
  </main>
  <footer hidden>
    <div id="search-panel" class="footer-search" hidden><label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="搜尋存放空間或物品" aria-label="搜尋存放空間或物品"></label></div>
    <div class="footer-actions">
      <button id="add" class="primary" aria-label="加入" title="加入" disabled><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>加入</span></button>
      <button id="toggle-search" class="secondary" aria-label="搜尋" title="搜尋" aria-expanded="false" aria-controls="search-panel"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><span>搜尋</span></button>
      <button id="back" class="secondary" aria-label="返回" title="返回" disabled><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m10 5-7 7 7 7M3 12h18"/></svg><span>返回</span></button>
    </div>
  </footer>
  <dialog id="snapshot-dialog" aria-labelledby="snapshot-title">
    <div class="section-title"><div><h2 id="snapshot-title"></h2><p id="snapshot-location" class="muted"></p></div><button id="snapshot-close" type="button" class="quiet" aria-label="關閉">✕</button></div>
    <div id="snapshot-stage">
      <p id="snapshot-status" role="status"></p>
      <img id="snapshot-image" alt="" draggable="false" hidden>
    </div>
    <div class="snapshot-navigation">
      <button id="snapshot-previous" type="button" class="quiet" aria-label="上一張">‹</button>
      <div class="snapshot-navigation-center"><button id="snapshot-recognize" type="button" class="quiet" hidden>Gemini 辨識</button><button id="snapshot-add" type="button" class="quiet" aria-controls="snapshot-add-form" aria-expanded="false" hidden>＋ 加入物品</button><span id="snapshot-count" aria-live="polite"></span><button id="snapshot-edit" type="button" class="quiet" hidden>編輯物品</button></div>
      <button id="snapshot-next" type="button" class="quiet" aria-label="下一張">›</button>
    </div>
    <p id="snapshot-recognition-status" class="muted" role="status"></p>
    <details id="gemini-settings" hidden>
      <summary>Gemini 專案設定</summary>
      <label class="field">Google Cloud 專案 ID<input id="gemini-project" autocomplete="off" spellcheck="false"></label>
      <p class="muted">辨識會將目前照片傳送給 Google Gemini，並使用此專案的用量與帳單。</p>
    </details>
    <button id="snapshot-use-suggestions" type="button" class="quiet" hidden>將建議填入名稱</button>
    <form id="snapshot-add-form" hidden>
      <label class="field">物品名稱<input id="snapshot-add-name" maxlength="1000" required placeholder="例如 黑胡椒醬 醋 龍眼"></label>
      <button type="submit" class="primary">加入</button>
    </form>
    <p id="snapshot-add-status" class="muted" role="status"></p>
  </dialog>
  <dialog id="marker-settings-dialog" aria-labelledby="marker-settings-title">
    <form id="marker-settings-form">
      <div class="section-title"><h2 id="marker-settings-title">圖示設定</h2><button id="marker-settings-close" type="button" class="quiet" aria-label="關閉">✕</button></div>
      <label class="marker-toggle"><input type="checkbox" id="markers-only">僅顯示圖示</label>
      <fieldset id="marker-label-options">
        <legend>標記文字</legend>
        <label class="field">大小<select id="marker-label-size"><option value="small">小</option><option value="normal">中</option><option value="large">大</option><option value="xlarge">特大</option></select></label>
        <label class="field">位置<select id="marker-label-position"><option value="above">圖示上方</option><option value="below">圖示下方</option></select></label>
        <label class="marker-toggle">顏色<input id="marker-label-color" type="color" value="#183d2a"></label>
      </fieldset>
      <div class="editor-actions"><button class="primary">儲存</button></div>
    </form>
  </dialog>
  <dialog id="move-dialog" aria-labelledby="move-title">
    <form id="move-form">
      <div class="section-title"><h2 id="move-title">移動物品</h2><button type="button" id="move-close" class="quiet" aria-label="關閉">✕</button></div>
      <p id="move-source" class="muted"></p>
      <fieldset id="move-options">
        <legend>選擇物品</legend>
        <div id="move-list"></div>
      </fieldset>
      <label id="move-target-field" class="field">移到<select id="move-target" required></select></label>
      <p id="move-status" role="status"></p>
      <div class="editor-actions"><button id="move-confirm" class="primary" disabled>移動</button></div>
    </form>
  </dialog>
  <dialog id="editor">
    <form id="form">
      <div class="section-title"><h2 id="editor-title"></h2><button type="button" id="close" class="quiet" aria-label="關閉">✕</button></div>
      <p id="location" class="muted"></p>
      <p id="entry-time" class="muted"></p>
      <fieldset id="add-kind-field" class="add-kind-field" hidden><legend>加入類型</legend><div id="add-kind" class="add-kind-grid"></div></fieldset>
      <label id="position-type-field" class="field" hidden>位置類型<select id="position-type"><option value="區">區</option><option value="格">格</option><option value="層">層</option></select></label>
      <label id="name-field" class="field">名稱<input id="name" required maxlength="80"></label>
      <div id="photos" hidden>
        <img id="preview" alt="物品照片預覽" hidden>
        <div id="batch-preview" class="batch-preview"></div>
      </div>
      <div class="photo-controls editor-submit">
        <label class="photo-button">拍照<input id="camera" type="file" accept="image/*" capture="environment"></label>
        <label class="photo-button">選擇照片<input id="gallery" type="file" accept="image/*" multiple></label>
        <button class="primary" id="save">儲存</button>
      </div>
      <div class="photo-controls editor-secondary">
        <button type="button" class="quiet" id="edit-photo" hidden>旋轉／裁切照片</button>
        <button type="button" class="quiet" id="remove-photo" hidden>移除照片</button>
        <button type="button" id="remove" class="danger" hidden>刪除</button>
      </div>
      <p id="form-status" role="status"></p>
    </form>
  </dialog>
  <dialog id="photo-editor" aria-labelledby="photo-editor-title">
    <h2 id="photo-editor-title">旋轉／裁切照片</h2>
    <canvas id="photo-canvas" aria-label="裁切預覽"></canvas>
    <div class="photo-controls">
      <button type="button" class="quiet" id="rotate-photo">向右轉 90°</button>
      <button type="button" class="quiet" id="reset-crop">重設</button>
    </div>
    <div id="crop-controls" class="crop-controls">
      <label>裁左 <input type="range" min="0" max="45" value="0"></label>
      <label>裁上 <input type="range" min="0" max="45" value="0"></label>
      <label>裁右 <input type="range" min="0" max="45" value="0"></label>
      <label>裁下 <input type="range" min="0" max="45" value="0"></label>
    </div>
    <div class="editor-actions">
      <button type="button" class="quiet" id="cancel-crop">取消</button>
      <button type="button" class="primary" id="apply-crop">套用</button>
    </div>
  </dialog>
  <dialog id="update-dialog" aria-labelledby="update-title" aria-describedby="update-version">
    <h2 id="update-title">有新版可以更新</h2>
    <p id="update-version" class="muted"></p>
    <div class="editor-actions"><button id="update-reload" class="primary" autofocus>立即更新</button></div>
  </dialog>
</body>
</html>
